name: 同步官方上游（PR 模式）

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: '强制同步（即使上游无新提交也重新生成 PR）'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: 'brunodev85/winlator-app'
  UPSTREAM_BRANCH: 'main'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 克隆官方上游到临时目录
        run: |
          git clone --depth 1 --branch "${UPSTREAM_BRANCH}" "https://github.com/${UPSTREAM_REPO}.git" /tmp/upstream-official 2>&1 | tail -2
          echo "=== 官方上游最新提交 ==="
          cd /tmp/upstream-official && git log --oneline -3

      - name: 检查上游是否有新提交
        id: check
        run: |
          LOCAL_DATE=$(git log -1 --format=%ct origin/main)
          UPSTREAM_DATE=$(cd /tmp/upstream-official && git log -1 --format=%ct)
          echo "本地最新提交日期: $LOCAL_DATE  官方最新提交日期: $UPSTREAM_DATE"
          if [ "$UPSTREAM_DATE" -le "$LOCAL_DATE" ] && [ "${{ github.event.inputs.force_sync }}" != "true" ]; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
            echo "官方无新提交，跳过。"
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
            echo "官方有新提交（或强制同步），开始同步。"
          fi

      - name: 用 rsync 同步官方 Java/res 代码
        id: sync
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          BRANCH="auto-sync-official"
          echo "sync_branch=$BRANCH" >> $GITHUB_OUTPUT

          git checkout -B "$BRANCH" origin/main

          # Pulse 定制文件保护名单（rsync 排除列表）
          EXCLUDE_FILES=(
            "README.md"
            "gradle.properties"
            "app/build.gradle"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/com/winlator/MainApplication.java"
            "app/src/main/java/com/winlator/core/AppUtils.java"
            "app/src/main/java/com/winlator/core/PatchUtils.java"
            "app/src/main/java/com/winlator/core/LaunchPathResolver.java"
            "app/src/main/java/com/winlator/container/LaunchArgs.java"
            "app/src/main/java/com/winlator/xserver/ScreenInfo.java"
            "app/src/main/java/com/winlator/xserver/extensions/XRandRExtension.java"
            "app/src/main/java/com/winlator/xserver/XServer.java"
            "app/src/main/java/com/winlator/XServerDisplayActivity.java"
            "app/src/main/java/com/winlator/services/InstallService.java"
            "app/src/main/java/com/winlator/Contents/ContentsFragment.java"
            "app/src/main/java/com/winlator/core/DownloadProgressDialog.java"
            "app/src/main/res/layout/download_progress_dialog.xml"
            "app/src/main/java/com/winlator/widget/FrameRating.java"
            "app/src/main/java/com/winlator/widget/HudSettingsDialog.java"
            "app/src/main/java/com/winlator/hud/WinlatorHUD.java"
            "app/src/main/java/com/winlator/box64/Box64Preset.java"
            "app/src/main/java/com/winlator/container/Container.java"
            "app/src/main/java/com/winlator/ContainerDetailFragment.java"
            "app/src/main/java/com/winlator/renderer/GLRenderer.java"
            "app/src/main/java/com/winlator/XServerView.java"
            "app/src/main/res/values-zh/strings.xml"
            "app/src/main/res/values-zh/arrays.xml"
            "app/src/main/res/values/arrays.xml"
            "app/src/main/res/values/strings.xml"
            ".github/workflows/android-ci.yml"
            ".github/workflows/build-coexist.yml"
            ".github/workflows/sync-upstream.yml"
          )

          EXCLUDE_ARGS=""
          for f in "${EXCLUDE_FILES[@]}"; do
            EXCLUDE_ARGS="$EXCLUDE_ARGS --exclude=$f"
          done

          echo "=== 同步官方 Java 源码 ==="
          rsync -av --delete $EXCLUDE_ARGS \
            /tmp/upstream-official/app/src/main/java/ \
            app/src/main/java/ 2>&1 | tail -20

          echo ""
          echo "=== 同步官方 res 资源 ==="
          rsync -av --delete $EXCLUDE_ARGS \
            /tmp/upstream-official/app/src/main/res/ \
            app/src/main/res/ 2>&1 | tail -20

          echo ""
          echo "=== 变更统计 ==="
          git add -A
          CHANGED=$(git diff --cached --name-only | wc -l)
          echo "变更文件数: $CHANGED"
          git diff --cached --name-only | head -30

          if [ "$CHANGED" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "无实际变更，不开 PR。"
          else
            git commit -m "sync: 同步官方上游代码（自动同步 Java 源码和 res 资源，Pulse 定制文件已排除）" 2>&1 | tail -3
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送 auto-sync 分支
        if: steps.check.outputs.up_to_date == 'false' && steps.sync.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ steps.sync.outputs.sync_branch }}"
          git push --force origin "$BRANCH" 2>&1 | tail -3

      - name: 创建/更新 PR 到 main
        if: steps.check.outputs.up_to_date == 'false' && steps.sync.outputs.has_changes == 'true'
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          SYNC_BRANCH: ${{ steps.sync.outputs.sync_branch }}
        run: |
          BRANCH="$SYNC_BRANCH"
          UPSTREAM_MSG=$(cd /tmp/upstream-official && git log --oneline -5)

          # 写 Python 脚本到临时文件，避免 heredoc 缩进问题
          cat > /tmp/create_pr.py << 'SCRIPTEOF'
import os, json, urllib.request

token = os.environ["PAT_TOKEN"]
repo = os.environ["GITHUB_REPOSITORY"]
branch = os.environ["BRANCH"]
upstream_msg = os.environ["UPSTREAM_MSG"]

body = """## 自动同步官方上游 brunodev85/winlator-app

此 PR 由定时工作流自动创建，同步官方 Winlator 最新 Java 源码和 res 资源。

### 同步范围
- Java 源码（app/src/main/java/）
- 资源文件（app/src/main/res/）
- 不同步 native 层（cpp/，Pulse 有共存定制）
- 不同步组件包（assets/，Pulse 自选版本）

### 保护文件
Pulse 原创/共存定制文件已排除：XRandR、后台安装、进度对话框、共存核心、中文资源、构建配置。

### 说明
- 此 PR 会自动触发 CI 构建验证
- 构建绿色后再合并

### 官方最近提交
```
""" + upstream_msg + """
```
"""

headers = {
    "Authorization": "token " + token,
    "Content-Type": "application/json",
    "Accept": "application/vnd.github+json"
}

owner = repo.split("/")[0]
req = urllib.request.Request(
    "https://api.github.com/repos/" + repo + "/pulls?state=open&head=" + owner + ":" + branch,
    headers=headers
)
with urllib.request.urlopen(req) as resp:
    existing = json.loads(resp.read())

if existing:
    pr_number = existing[0]["number"]
    print("更新已有 PR #" + str(pr_number))
    data = json.dumps({"title": "sync: 同步官方上游（自动生成）", "body": body}).encode()
    req = urllib.request.Request(
        "https://api.github.com/repos/" + repo + "/pulls/" + str(pr_number),
        data=data, headers=headers, method="PATCH"
    )
else:
    print("创建新 PR")
    data = json.dumps({
        "title": "sync: 同步官方上游（自动生成）",
        "head": branch,
        "base": "main",
        "body": body
    }).encode()
    req = urllib.request.Request(
        "https://api.github.com/repos/" + repo + "/pulls",
        data=data, headers=headers, method="POST"
    )

with urllib.request.urlopen(req) as resp:
    result = json.loads(resp.read())
    print("PR 操作完成: #" + str(result.get("number", "unknown")))
SCRIPTEOF

          BRANCH="$BRANCH" UPSTREAM_MSG="$UPSTREAM_MSG" python3 /tmp/create_pr.py

      - name: 无更新时提示
        if: steps.check.outputs.up_to_date == 'true'
        run: echo "官方已是最新，无需同步。"

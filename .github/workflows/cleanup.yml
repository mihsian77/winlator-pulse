name: 清理仓库（用完即删）

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 删除无用文件
        run: |
          git rm -r patches/ 2>/dev/null || true
          git rm .github/workflows/build-native.yml 2>/dev/null || true

      - name: 提交
        run: |
          git commit -m "chore: 清理无用文件与旧工作流" --allow-empty || true
          git push origin HEAD

      - name: 删除本工作流（自删）
        run: |
          gh extension install actions/gh-actions-cache 2>/dev/null || true
          rm -f .github/workflows/cleanup.yml
          git add .github/workflows/cleanup.yml
          git commit -m "chore: 清理完成，移除清理工作流" --allow-empty
          git push origin HEAD
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

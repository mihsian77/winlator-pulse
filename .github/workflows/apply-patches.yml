name: 应用补丁（用完即删）

on:
  push:
    branches: [main]
    paths:
      - 'patches/*.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 应用补丁
        run: |
          set -e
          sed -i 's/\r$//' patches/*.patch
          git apply --verbose patches/hud-settings.patch

      - name: 提交并自删
        run: |
          git add -A
          git rm -f patches/*.patch 2>/dev/null || true
          git rm -f .github/workflows/apply-patches.yml 2>/dev/null || true
          git commit -m "feat: HUD设置面板 左划菜单23项元素可勾选 默认启用12项 即时生效"
          git push origin HEAD

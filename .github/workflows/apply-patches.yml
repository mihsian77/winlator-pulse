name: 应用补丁（用完即删）

on:
  push:
    branches: [main]
    paths:
      - 'patches/*.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 应用补丁
        run: |
          set -e
          # 关键：手机网页上传文本常被转成 CRLF，统一还原为 LF，否则 git apply 对不上空跑
          sed -i 's/\r$//' patches/*.patch
          PATCH=patches/hud-settings.patch
          echo "=== 应用 $PATCH ==="
          git apply --verbose "$PATCH"

      - name: 提交修改并自删补丁与本工作流
        run: |
          git add -A
          git rm -f patches/*.patch 2>/dev/null || true
          git rm -f .github/workflows/apply-patches.yml 2>/dev/null || true
          git commit -m "feat: 新增 HUD 设置面板" -m "- 左划菜单加入 HUD 设置入口
- 新增 HudSettingsDialog，23 项性能元素可勾选
- 默认启用 FPS/CPU/GPU/内存/温度/帧时间图等 12 项
- 勾选后即时刷新显示"
          git push origin HEAD

name: 应用补丁（用完即删）

on:
  push:
    branches: [main]
    paths:
      - 'patches/*.patch'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 配置 git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"

      - name: 应用所有补丁
        run: |
          ls patches/*.patch 2>/dev/null || echo "没有补丁文件，退出" && exit 0
          for patch in patches/*.patch; do
            echo "=== 应用 $patch ==="
            git apply "$patch" || echo "警告: $patch 应用失败，跳过"
          done

      - name: 提交修改并自删
        run: |
          git add -A
          git rm patches/*.patch 2>/dev/null || true
          git rm .github/workflows/apply-patches.yml 2>/dev/null || true
          git commit -m "feat: 添加 HUD 设置功能" --allow-empty
          git push origin HEAD
